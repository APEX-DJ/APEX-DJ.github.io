<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="description" content="DJ Stylez's pro auto-mixing DJ app.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Studios DJ App</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-64.png">
<meta name="apple-mobile-web-app-title" content="Apex Studios DJ App">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: logo bar on top (on every screen), crates on the left, songs in the middle, a lit-up hardware face plate pinned underneath.
   Palette taken from the Apex Studios logo: deep black, Apex red, gold and chrome, with electric cyan and violet for life. */
:root{
  color-scheme: dark;
  --bg:#07080d; --panel:#121420; --panel2:#1a1d2c; --raise:#252a3d; --line:#2a2f45;
  --fg:#f2f3f8; --muted:#a0a6bf; --faint:#6a7090;
  --red:#ff3b4e; --gold:#ffc23d; --orange:#ff8a3d; --cyan:#22d3ee; --violet:#a78bfa; --green:#4ade80; --pink:#ff5fa2;
  --ink:#16080b;
  --grad:linear-gradient(135deg,#ff3b4e 0%,#ff8a3d 55%,#ffc23d 100%);
  --grad-cool:linear-gradient(135deg,#22d3ee 0%,#a78bfa 100%);
  --title:linear-gradient(180deg,#ff3347 0%,#d90f2b 42%,#8a2a8f 62%,#1f8fff 82%,#3fd0ff 100%);
  --red-wash:rgba(255,59,78,.16); --cyan-wash:rgba(34,211,238,.14); --gold-wash:rgba(255,194,61,.14); --violet-wash:rgba(167,139,250,.16);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;color:var(--fg);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;
  background:radial-gradient(900px 520px at 0% 0%,rgba(255,59,78,.16),transparent 60%),radial-gradient(800px 520px at 100% 30%,rgba(34,211,238,.10),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(167,139,250,.12),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* top bar — pure black so the logo video blends in */
.top{position:relative;display:flex;align-items:center;gap:12px;padding:4px 16px;background:#000}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--red),var(--gold),var(--cyan),var(--violet))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:84px;width:auto;aspect-ratio:16/9;max-width:40vw;flex:none;display:block;background:#000}
/* title: two-tone red fading into a bright blue base, every letter bouncing on the beat */
.word{display:inline-flex;flex-wrap:wrap;align-items:flex-end;row-gap:2px;font:800 32px/1 var(--display);letter-spacing:.05em;white-space:nowrap;padding-top:8px}
.brand{position:relative;z-index:3}
.word .w{position:relative;display:inline-flex;align-items:flex-end;perspective:420px}
.word .ball{position:absolute;left:0;bottom:.06em;width:.42em;height:.42em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#3fd0ff 30%,#1f4fff 65%,#0a0f40);box-shadow:0 0 10px #3fd0ff;pointer-events:none}
.word .sp{display:inline-block;width:.32em}
.word .br{display:none}
.word .l,.tt{background:var(--title);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(31,143,255,.35))}
.word .l{display:inline-block;transform-origin:50% 100%;will-change:transform,opacity}
.foot-brand{display:flex;justify-content:center;align-items:baseline;gap:8px;font:800 18px/1 var(--display);letter-spacing:.08em;padding-top:2px}
.foot-brand small{font:600 11px var(--mono);color:var(--faint);letter-spacing:0}
.ver{align-self:flex-start;margin-top:10px;border:1px solid color-mix(in srgb,var(--cyan) 50%,transparent);background:var(--cyan-wash);color:var(--cyan);border-radius:999px;padding:2px 8px;font:700 11px var(--mono);white-space:nowrap}
.ver:hover{background:color-mix(in srgb,var(--cyan) 28%,transparent)}
.top .grow{flex:1}
.search{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:min(260px,34vw);min-width:0}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:var(--cyan)}

/* main */
.main{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}
.side{border-right:1px solid var(--line);overflow:auto;padding:16px 12px 16px 16px;display:flex;flex-direction:column;gap:14px;background:rgba(12,13,22,.7)}
.side h3{margin:0;font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.crates{display:flex;flex-direction:column;gap:4px}
.crate{--c:var(--cyan);display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:var(--fg)}
.crate::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.crate .n{overflow-wrap:anywhere;line-height:1.25;font-weight:600}
.crate .c{color:var(--muted);font-size:11px;text-align:right;line-height:1.3}
.crate:hover{background:var(--panel2)}
.crate[aria-current="true"]{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),transparent);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.crate.addpl{display:none}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 10px;border-radius:10px;background:linear-gradient(90deg,rgba(255,194,61,.14),rgba(255,59,78,.08));border:1px solid rgba(255,194,61,.25)}
.fbar h3{display:flex;align-items:center;gap:8px}
.fbar svg,.ficon{width:30px;height:30px;flex:none}
#folderBtn{padding:0;width:42px;height:42px;min-height:0;border:1px solid rgba(63,208,255,.35);border-radius:10px;background:#0b0d18;overflow:hidden;box-shadow:0 0 14px rgba(255,51,71,.25)}
#folderBtn .ficon{width:100%;height:100%;margin:0;display:block}
#folderBtn span{display:none}
#folderBtn:hover{filter:brightness(1.12)}
.fmrow .ficon{width:36px;height:36px}
.fbar button{border:0;border-radius:999px;padding:4px 10px;background:var(--grad);color:var(--ink);font-weight:700;font-size:12px}
.fm{display:grid;gap:8px}
.fmrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.fmrow .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmrow .c{grid-column:2;display:flex;align-items:center;gap:8px;color:var(--muted);font:12px var(--mono)}
.fcount{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--cyan-wash);border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);color:var(--cyan);font:700 13px var(--mono)}
.ftime{color:var(--gold);font:600 12px var(--mono)}
.fcount,.ftime{white-space:nowrap}
@media (max-width:700px){ .sheet .fmrow{grid-template-columns:auto minmax(0,1fr)} .sheet .fmrow .b{grid-row:auto;grid-column:1/-1;justify-content:flex-start;padding-left:46px} .sheet .fmrow .ficon{grid-row:1/3} .sheet .fmrow .n{white-space:normal} }
.fmrow .b{grid-row:1/3;grid-column:3;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.fmrow .b button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.fmrow .ficon{grid-row:1/3}
.dest{display:grid;gap:10px}
.dest label{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dest input[type=text],.dest select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;flex:1}
.dest input[type=radio]{accent-color:var(--red)}
.btsteps{display:grid;gap:10px;font-size:14px;color:var(--muted)}
.btsteps b{color:var(--cyan)}
.log{display:grid;gap:12px}
.log h3{margin:0;font:800 20px var(--display);color:var(--gold)}
.log ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:3px}
.dd{position:relative}
.ddbtn{gap:8px;border-color:color-mix(in srgb,var(--cyan) 45%,transparent);color:var(--cyan)}
.ddbtn .caret{width:14px;height:14px;transition:transform .2s}
.ddbtn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.ddlist{position:absolute;right:0;bottom:calc(100% + 8px);z-index:25;min-width:260px;max-width:calc(100vw - 24px);display:grid;gap:2px;padding:6px;border-radius:14px;background:linear-gradient(180deg,#1d2132,#121420);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.6)}
.wakegrp{display:contents}
.ddi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--fg);font-weight:600;font-size:14px}
.ddi:hover{background:var(--raise)}
.ddi svg,.ddi img{width:22px;height:22px;flex:none}
#recsItem svg{color:var(--red)} #selItem svg{color:var(--cyan)} #storeItem svg{color:var(--green)} #hookItem svg{color:var(--violet)} #fixItem svg{color:var(--red)} #dupItem svg{color:var(--orange)} #planItem svg{color:var(--gold)} #voxItem svg{color:var(--pink)} #cleanItem svg{color:var(--green)} #voxItem[aria-pressed="true"],#cleanItem.on{background:var(--violet-wash)} #wakeBtn svg{color:var(--gold)} #miniBtn svg{color:var(--green)} #btBtn svg{color:#3b82f6} #setBtn svg{color:var(--violet)} #newsItem svg{color:var(--pink)}
#wakeBtn[aria-pressed="true"]{background:var(--gold-wash)} #wakeBtn[aria-pressed="true"] span{color:var(--gold)}
.app.mini #miniBtn{background:var(--cyan-wash)}
.viewsel{display:none;width:100%;background:var(--panel2);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--fg);border-radius:12px;padding:10px 12px;font-weight:700}
.sel{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--fg);font-weight:600;max-width:100%}
.sel:focus{border-color:var(--gold)}
.iconbig{display:block;width:min(260px,70%);margin:0 auto;border-radius:22%;box-shadow:0 10px 40px rgba(31,143,255,.35)}
.newpl{display:flex;gap:6px}
.newpl input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.side .note{font-size:12px;color:var(--faint);line-height:1.5;margin:0}

.content{overflow:auto;min-width:0;padding:20px 16px 28px}
.vhead{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px;text-align:center}
.vhead .titles{flex:none;width:100%}
.vhead .acts{justify-content:center}
.vhead h1.tt{background-image:var(--title);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(31,143,255,.3))}
.vhead h1{margin:0;font:800 clamp(32px,5vw,48px)/1 var(--display);letter-spacing:.02em;text-wrap:balance;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.vhead .titles{display:flex;flex-direction:column;gap:10px;min-width:0;flex:none;width:100%;align-items:center;text-align:center}
.vhead .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.stat{display:inline-flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--panel)}
.stat b{font:700 16px var(--mono);font-variant-numeric:tabular-nums}
.stat.songs b{color:var(--cyan)} .stat.time b{color:var(--gold)} .stat.tempo b{color:var(--pink)}
.order{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.order span{font-size:12px;color:var(--muted);padding:0 6px 0 8px}
.order button{border:0;border-radius:999px;padding:5px 12px;background:none;color:var(--muted);font-weight:600;font-size:13px}
.order button[aria-pressed="true"]{background:var(--grad-cool);color:#071018}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:38px;color:var(--fg);white-space:nowrap;font-weight:600}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--ink);box-shadow:0 6px 20px rgba(255,59,78,.25)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.cool{background:var(--grad-cool);border-color:transparent;color:#071018}
.btn.ghost{background:none}
.btn.danger{color:var(--red)}
.btn svg{width:18px;height:18px;flex:none}
.addbooth{display:grid;place-items:center;width:42px;height:42px;padding:5px;border:1px solid rgba(63,208,255,.35);border-radius:10px;background:#0b0d18;box-shadow:0 0 14px rgba(255,51,71,.25);flex:none}
.addbooth:hover{border-color:rgba(255,51,71,.6);box-shadow:0 0 18px rgba(255,51,71,.4)}
.addbooth svg{width:100%;height:100%;display:block}
.btn:disabled{opacity:.45;cursor:default}

/* song list */
.list{border-top:1px solid var(--line)}
.row,.lhead{display:grid;grid-template-columns:34px minmax(0,1fr) 78px 100px 58px 38px;align-items:center;gap:10px;padding:7px 8px}
.row{border-bottom:1px solid rgba(42,47,69,.6);border-radius:10px;content-visibility:auto;contain-intrinsic-size:auto 52px}
.row:hover{background:rgba(37,42,61,.55)}
.row.on{background:linear-gradient(90deg,var(--red-wash),rgba(255,194,61,.06) 60%,transparent);box-shadow:inset 3px 0 0 var(--red)}
.lhead{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding-block:9px}
.lhead button{background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left}
.lhead button[data-dir]::after{content:attr(data-dir);margin-left:4px;color:var(--gold)}
.r-n{width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--faint);font:12px var(--mono);display:grid;place-items:center}
.row:hover .r-n,.r-n:focus-visible{background:var(--grad);color:var(--ink)}
.row:hover .r-n span,.r-n:focus-visible span{display:none}
.r-n svg{display:none;width:14px;height:14px}
.row:hover .r-n svg,.r-n:focus-visible svg{display:block}
.row.on .r-n span{display:none}
.row.on .r-n::before{content:"";width:12px;height:12px;background:linear-gradient(var(--red),var(--gold)) 0 100%/3px 60% no-repeat,linear-gradient(var(--gold),var(--gold)) 50% 100%/3px 100% no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 100%/3px 40% no-repeat;animation:eq 1s infinite alternate}
.row.on:hover .r-n::before{display:none}
@keyframes eq{to{background-size:3px 30%,3px 70%,3px 100%}}
.r-t{min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.r-t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-t small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-t .mt{display:none}
.r-b{--bh:200;justify-self:start;font:600 12px var(--mono);font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:999px;color:hsl(var(--bh) 90% 72%);background:hsl(var(--bh) 70% 50% / .14);border:1px solid hsl(var(--bh) 70% 55% / .35)}
.r-b.none{color:var(--faint);background:none;border-style:dashed;border-color:var(--line)}
.r-time{font:13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.r-k{display:flex;align-items:center;gap:6px;min-width:0}
.r-k small{color:var(--muted);font-size:12px}
.chip{--h:200;display:inline-grid;place-items:center;min-width:36px;height:24px;padding:0 6px;border-radius:6px;font:600 12px var(--mono);background:hsl(var(--h) 55% 22%);color:hsl(var(--h) 90% 76%);border:1px solid hsl(var(--h) 55% 38%)}
.chip.none{background:none;border:1px dashed var(--line);color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:transparent}
.dot.perfect,.dot.good{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.ok{background:var(--gold)}
.dot.clash{background:var(--red)}
.more{width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.more:hover{background:var(--raise);color:var(--fg)}
.more svg{width:18px;height:18px}

.empty{max-width:640px;margin:24px 0;display:flex;flex-direction:column;gap:14px}
.empty h2{margin:0;font:800 36px/1.05 var(--display);letter-spacing:.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.empty .acts{display:flex;flex-wrap:wrap;gap:8px}
.tips{display:grid;gap:10px;margin-top:6px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.tips div{font-size:14px;color:var(--muted)}
.tips b{color:var(--gold);font-weight:700}

/* mini view: just the logo, what's playing, and the face plate */
.miniview{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;min-height:0;overflow:auto;text-align:center}
.miniview video{width:min(720px,100%);aspect-ratio:16/9;height:auto;max-height:46vh;background:#000;border-radius:14px;box-shadow:0 0 60px rgba(255,59,78,.18)}
.miniview .mt1{font:800 clamp(26px,5vw,44px)/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;max-width:100%;overflow-wrap:anywhere}
.miniview .mt2{color:var(--muted);font-size:16px}
.miniview .mbar{width:min(560px,100%);height:8px;border-radius:4px;background:var(--raise);overflow:hidden}
.miniview .mbar i{display:block;height:100%;width:0;background:var(--grad)}
.app.mini .main{display:none}

/* face plate */
.player{position:relative;background:linear-gradient(180deg,#191c2b,#0c0e17);padding:12px 16px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.player::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--gold),var(--red))}
.decks{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);gap:16px;align-items:center}
.deck{--dc:var(--red);--dg:linear-gradient(90deg,var(--red),var(--gold));display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;opacity:.45;transition:opacity .3s}
#deck1{--dc:var(--cyan);--dg:linear-gradient(90deg,var(--cyan),var(--violet))}
.deck.live{opacity:1}
.dl{grid-row:span 3;font:800 36px/1 var(--display);color:var(--faint);width:26px;text-align:center}
.deck.live .dl{color:var(--dc);text-shadow:0 0 14px var(--dc)}
.dt{min-width:0;display:flex;gap:8px;align-items:baseline}
.dt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.dt small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar{position:relative;height:9px;border-radius:5px;background:var(--raise);overflow:hidden;cursor:pointer}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--dg);border-radius:5px}
.bar u{position:absolute;top:0;bottom:0;left:0;width:0;background:repeating-linear-gradient(135deg,rgba(255,194,61,.6) 0 3px,transparent 3px 6px)}
.dm{display:flex;justify-content:space-between;gap:8px;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.dm span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xf{display:grid;gap:5px;justify-items:center}
.xf .track{position:relative;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--raise) 40%,var(--raise) 60%,var(--cyan))}
.xf .knob{position:absolute;top:50%;width:14px;height:22px;border-radius:4px;background:linear-gradient(180deg,#fff,#b9bfcc);transform:translate(-50%,-50%);left:0;transition:left .1s linear;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.xf small{font:700 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center}
.xf.mixing small{color:var(--gold)}

.lower{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.transport,.fx{display:flex;align-items:center;gap:6px}
.ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--fg)}
.ic:hover{background:var(--raise)}
.ic svg{width:20px;height:20px}
.ic.big{width:56px;height:56px;background:var(--grad);border:0;color:var(--ink);box-shadow:0 6px 22px rgba(255,59,78,.35)}
.ic.big svg{width:26px;height:26px}
#mixBtn{border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold)}
#dropBtn{border-color:color-mix(in srgb,var(--pink) 45%,transparent);color:var(--pink)}
.toggle{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;color:var(--muted);min-height:38px;font-weight:600}
.toggle i{width:30px;height:18px;border-radius:9px;background:var(--raise);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--muted);top:2px;left:2px;transition:transform .2s,background .2s}
.toggle[aria-pressed="true"]{color:var(--fg);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.toggle[aria-pressed="true"] i{background:var(--green)}
.toggle[aria-pressed="true"] i::after{transform:translateX(12px);background:#fff}

/* volume cluster */
.vol{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:#0a0b12;border:1px solid var(--line);box-shadow:inset 0 1px 6px rgba(0,0,0,.6)}
.vb{--vc:var(--cyan);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--vc) 55%,transparent);background:color-mix(in srgb,var(--vc) 16%,transparent);color:var(--vc);font:700 20px/1 var(--body)}
.vb:hover{background:color-mix(in srgb,var(--vc) 28%,transparent)}
.vb svg{width:18px;height:18px}
.beatsel{background:var(--panel2);border:1px solid color-mix(in srgb,var(--green) 45%,transparent);color:var(--green);border-radius:999px;padding:7px 10px;font-weight:700;min-height:38px}
.vb.shuf{--vc:var(--orange)} .vb.rep{--vc:var(--green)}
.vb.shuf[aria-pressed="false"],.vb.rep[aria-pressed="false"]{opacity:.55;filter:saturate(.4)}
.vb.shuf[aria-pressed="true"],.vb.rep[aria-pressed="true"]{box-shadow:0 0 12px color-mix(in srgb,var(--vc) 60%,transparent)}
.recbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--red) 55%,transparent);background:var(--red-wash);color:var(--red);border-radius:999px;padding:6px 12px;font-weight:800;letter-spacing:.06em;min-height:38px}
.recbtn .rdot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);flex:none}
.recbtn.on{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 18px rgba(255,59,78,.55)}
.recbtn.on .rdot{background:#fff;box-shadow:none;animation:blink 1s infinite}
.recbtn .rtime{font-size:13px}
@keyframes blink{50%{opacity:.2}}
.recrow{display:grid;gap:8px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.recrow .rn{font-weight:700;overflow-wrap:anywhere}
.recrow .rm{color:var(--muted);font:12px var(--mono)}
.recrow .rb{display:flex;gap:6px;flex-wrap:wrap}
.recrow .rb button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.recrow .rb .del{color:var(--red)}
.recrow audio{width:100%}
.vb.vox{--vc:var(--pink)} .vb.cln{--vc:var(--green);font:800 15px/1 var(--body)}
.vb.vox[aria-pressed="true"],.vb.cln[aria-pressed="true"]{background:var(--vc);color:#0b0d18;box-shadow:0 0 12px color-mix(in srgb,var(--vc) 60%,transparent)}
.flags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.flag{font:800 10px/1 var(--body);letter-spacing:.06em;padding:3px 6px;border-radius:999px;border:1px solid currentColor}
.flag.nv{color:var(--pink)} .flag.cl{color:var(--green)}
.selbar{position:sticky;top:-20px;z-index:4;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px;margin:0 0 12px;border-radius:14px;background:linear-gradient(90deg,rgba(255,51,71,.18),rgba(31,143,255,.18));border:1px solid rgba(63,208,255,.35);backdrop-filter:blur(8px)}
.selbar .cnt{font:800 18px var(--display);letter-spacing:.04em;margin-right:4px}
.selbar .btn{min-height:34px;padding:6px 12px}
.row.picked{background:linear-gradient(90deg,rgba(255,51,71,.2),rgba(31,143,255,.12));box-shadow:inset 3px 0 0 var(--cyan)}
.pick{width:22px;height:22px;accent-color:var(--red);margin:0 auto;display:block;cursor:pointer}
.selmode .row{cursor:pointer}
.ex{color:var(--red);font:700 10px var(--mono);margin-left:6px;vertical-align:middle;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.ex.ok{color:var(--green)}
.plan{display:grid;gap:4px;counter-reset:n}
.plan .pr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--panel2)}
.plan .pr.now{box-shadow:inset 3px 0 0 var(--red)}
.plan .pr b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.plan .pr small{color:var(--muted);font:12px var(--mono)}
.plan .pn{font:700 12px var(--mono);color:var(--faint);text-align:center}
.plan .tx{font:700 11px var(--mono);padding:3px 8px;border-radius:999px;white-space:nowrap}
.plan .tx.bm{color:var(--green);background:rgba(74,222,128,.12)} .plan .tx.fd{color:var(--gold);background:var(--gold-wash)}
.plan .sep{margin:8px 0 2px;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.tip{position:fixed;z-index:60;pointer-events:none;max-width:260px;padding:6px 10px;border-radius:8px;background:#0b0d18;border:1px solid rgba(63,208,255,.45);color:var(--fg);font:600 12px/1.3 var(--body);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.dupd{border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.dupd summary{cursor:pointer;padding:10px 12px;font-weight:700;color:var(--cyan);list-style:none}
.dupd summary::after{content:" ▾"} .dupd[open] summary::after{content:" ▴"}
@media (max-width:700px){ .toast{font-size:13px;padding:8px 12px;max-width:calc(100% - 24px)} }
.fixbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;padding:10px 12px;margin:0 0 12px;border-radius:14px;background:rgba(255,59,78,.12);border:1px solid rgba(255,59,78,.45);font-size:14px;text-align:center}
.fixbar b{color:var(--red)}
.en{font:700 11px var(--mono);color:hsl(calc(200 - var(--e) * 20) 95% 62%);margin-right:2px}
@media (max-width:700px){
  .list .lhead{display:none}
  .row{grid-template-columns:26px minmax(0,1fr) auto 28px;grid-template-areas:"n t b m" "n t k m";gap:2px 8px;padding:8px 6px}
  .row .r-n{grid-area:n;width:26px;height:26px} .row .r-t{grid-area:t} .row .r-b{grid-area:b;justify-self:end;align-self:end;font-size:11px;padding:1px 7px}
  .row .r-k{grid-area:k;justify-self:end;align-self:start} .row .more{grid-area:m;width:28px} .row .r-k .dot{display:none}
  .row .r-k .chip{min-width:30px;height:20px;font-size:11px}
  .row .r-t b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
  .row .r-time{display:none}
}
.mixsep{margin:14px 0 6px;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:700;color:var(--gold);background:var(--gold-wash);text-align:center}
.row.dim{opacity:.4}
.mixtag{font:700 10px var(--mono);padding:1px 6px;border-radius:999px;margin-right:4px;white-space:nowrap}
.mixtag.m{color:var(--green);background:rgba(74,222,128,.12)} .mixtag.r{color:var(--cyan);background:var(--cyan-wash)} .mixtag.c{color:var(--gold);background:var(--gold-wash)} .mixtag.x{color:var(--faint)}
.mixctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:13px;color:var(--muted)}
.mixctl select{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--fg);font-weight:700}
.vb.mute{--vc:var(--violet)} .vb.down{--vc:var(--cyan)} .vb.up{--vc:var(--gold)} .vb.pause{--vc:var(--red)} .vb.minbtn{--vc:var(--green)}
.vb.mute[aria-pressed="true"]{background:var(--violet);color:#120b24}
.vu{display:flex;align-items:flex-end;gap:2px;height:22px;padding:0 2px}
.vu i{width:4px;height:100%;border-radius:2px;background:var(--raise);transition:background .08s}
.vu i.on.g{background:var(--green)} .vu i.on.y{background:var(--gold)} .vu i.on.r{background:var(--red)}
.vlev{font:600 12px var(--mono);color:var(--muted);min-width:3.2ch;text-align:right}
.vol.muted .vlev{color:var(--violet)}

.upnext{flex:1 1 280px;min-width:0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
@media (max-width:700px){ .upnext{flex-wrap:wrap;gap:4px 10px} .upnext .lab{max-width:none;flex-basis:100%} .upnext .what{flex:1 1 100%} .upnext .badge{order:3} .player .upnext .what b,.player .upnext .what span{white-space:normal;overflow:visible} }
.upnext .lab{font:700 10px/1.5 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);flex:none;max-width:12em}
.upnext .what{min-width:0;display:flex;flex-direction:column}
.upnext .what b{color:var(--fg);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upnext .what span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor;flex:none}
.badge.perfect,.badge.good{color:var(--green)}
.badge.ok{color:var(--gold)}
.badge.clash{color:var(--red)}
.badge.unknown{color:var(--faint)}
.tools{display:flex;gap:8px;margin-left:auto;align-items:center}
.wake{display:flex;align-items:center;gap:4px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.wake .btn{border:0;border-radius:999px;min-height:34px;padding:6px 12px;background:none;color:var(--muted)}
.wake .btn[aria-pressed="true"]{color:var(--green)}
.wake .vb{width:34px;height:34px}

/* sheets and dialogs */
.scrim{position:fixed;inset:0;background:rgba(4,4,10,.7);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{width:min(540px,100%);max-height:calc(100% - 32px);overflow:auto;background:linear-gradient(180deg,#171a28,#10121c);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheetlogo{display:block;width:100%;height:auto;aspect-ratio:16/9;max-height:120px;object-fit:contain;background:#000;border-radius:10px}
.sheet h2{margin:0;font:800 26px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.sheet p{margin:0;color:var(--muted)}
.menu{display:grid;gap:2px}
.menu button{background:none;border:0;border-radius:10px;text-align:left;padding:11px 12px}
.menu button:hover{background:var(--raise)}
.menu button.danger{color:var(--red)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.field .inl{display:flex;gap:6px}
.field .inl .btn{min-height:36px;padding:6px 10px}
.field .hint{font-size:12px;color:var(--faint)}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.opts{display:grid;gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:var(--ink);font-weight:700}
.opt{display:grid;gap:7px}
.opt > span{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.02em}
.opt > small{color:var(--faint);font-size:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;accent-color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:12px;padding:10px 14px;max-width:min(520px,calc(100% - 32px));z-index:30;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.busy{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:14px;border-radius:12px;background:var(--cyan-wash);color:var(--cyan);font-size:13px}
.busy::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
.busy span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.busy button{border:1px solid currentColor;background:none;color:inherit;border-radius:999px;padding:3px 10px;font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.dropping .content{outline:2px dashed var(--gold);outline-offset:-8px}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;overflow:visible;padding:8px 16px;gap:8px}
  .side h3,.side .note,.newpl{display:none}
  .crates{flex-direction:row;gap:6px}
  .crate{width:auto;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 12px;grid-template-columns:8px auto auto}
  .crate::before{width:8px;height:8px}
  .crate .c{display:none}
  .crate.addpl{display:inline-flex}
  .viewsel{display:block}
  .side .crates{display:none}
  .fbar{display:none}
  .top{flex-wrap:wrap}
  .word{font-size:26px}
  .row,.lhead{grid-template-columns:30px minmax(0,1fr) 62px 44px 34px;gap:8px}
  .r-time,.lhead .h-time,.r-k small{display:none}
  .r-t .mt{display:inline}
  .search{width:auto;flex:1}
  .word{font-size:20px}
  .logo{height:84px}
  .addfolder span{display:none}
  .decks{grid-template-columns:minmax(0,1fr);gap:8px}
  .xf{grid-template-columns:auto 1fr;align-items:center;gap:10px}
  .xf small{order:-1}
  .dl{font-size:26px}
  .upnext{flex-basis:100%;order:-1}
  .player{padding:8px 12px 10px;gap:8px}
  .deck:not(.live){display:none}
  .xf:not(.mixing){display:none}
  .dt small{display:none}
  .fx .btn{padding:8px 10px}
  .fx .btn .lbl,.vu{display:none}
  .lower{gap:8px}
  .vol{order:5;padding:4px 6px;gap:4px}
  .vb{width:34px;height:34px}
  .tools{order:6}
  .wake .btn{padding:6px 8px;font-size:13px}
  .tools{margin-left:auto}
  .fields{grid-template-columns:1fr}
  .toast{bottom:calc(260px + env(safe-area-inset-bottom,0px))}
}
.more-ctl{display:none}
@media (max-width:700px), (max-height:560px){
  .top{padding:4px 12px 6px;gap:8px;flex-wrap:wrap}
  .brand{flex:1 1 100%;gap:8px}
  .logo{height:58px}
  .word{font-size:23px;padding-top:4px;white-space:normal;line-height:1.05}
  .word .br{display:block;flex-basis:100%;height:0}
  .word .sp2{display:none}

  .top .grow{display:none}

  .player.open .tools{margin-left:0;width:100%;justify-content:flex-end}
  .ddlist{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));min-width:0;max-width:none;max-height:70%;overflow:auto;z-index:40}
  .toast{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto}
}
@media (max-height:560px) and (min-width:701px){ .brand{flex:0 1 auto} .top .grow{display:block} .search{flex:0 1 260px} }
@media (max-width:520px){ #addBtn span{display:none} }

/* top bar: the title always sits in the exact center of the screen */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:12px}
.top .grow{display:none}
.brand{justify-self:start;min-width:0}
.logo{max-width:100%}
.titlebox{position:relative;justify-self:center;display:flex;justify-content:center;min-width:0}
.titlebox .ver{position:absolute;left:calc(100% + 8px);top:8px;margin:0}
.word{justify-content:center;text-align:center}
.tright{justify-self:end;display:flex;align-items:center;gap:8px;min-width:0}
.tright .search{min-width:0}

  /* phones: Row 1 = logo (left) | title (dead center) | space. Row 2 = folder | search | add music */

  #folderBtn{order:-1}
  #folderBtn,#addBtn{margin:0;width:34px;height:34px;border-radius:8px}
  .addbooth{padding:4px}
  .tright .search{width:100%;flex:none;padding:6px 12px;font-size:14px;height:34px}

async function speakerButton() {
  ensureCtx(); actx.resume().catch(() => {});
  const el = bgMode || !(A().el instanceof HTMLMediaElement) ? bgEl : (A().track ? A().el : bgEl);
  if (typeof el.webkitShowPlaybackTargetPicker === "function") { // Safari on iPhone and Mac: the system speaker picker
    try { if (!el.src) el.src = silentUrl; el.webkitShowPlaybackTargetPicker(); return; } catch (e) {}
  }
  if (navigator.mediaDevices && navigator.mediaDevices.selectAudioOutput) {
    try { const dev = await navigator.mediaDevices.selectAudioOutput(); if (await setOutput(dev.deviceId, dev.label)) return; } catch (e) {}
  }
  let outs = [];
  try { outs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audiooutput" && d.label && d.deviceId !== "default"); } catch (e) {}
  speakerSheet(actx.setSinkId ? outs : []);
}
async function setOutput(id, label) {
  try { if (actx.setSinkId) await actx.setSinkId(id); else return false; } catch (e) { return false; }
  try { if (bgEl.setSinkId) await bgEl.setSinkId(id); } catch (e) {}

}

  ensureCtx(); actx.resume().catch(() => {});

/* ---------- bouncing title ---------- */
/* Title choreography. Every word runs its own routine on its own timing, and every letter in the word performs it
   with its own little twist. Each word works through the whole set of routines (in its own shuffled order) before
   repeating, so the moves keep changing: piano keys, spins, flips, falling back, falling forward, a bowling strike,
   an explosion, rolling in, flying away, flying in and a wave. Fast songs dance at half time so it never looks frantic. */
const TITLE = "Apex Studios DJ App";
(function buildTitle() {
  $("#word").innerHTML = TITLE.split(" ").map((w, wi) => `<span class="w" data-w="${wi}" aria-hidden="true">${[...w].map(ch => `<span class="l">${ch}</span>`).join("")}</span>`).join('<span class="sp" aria-hidden="true"></span>').replace(/(<span class="w" data-w="1"[^]*?<\/span><\/span>)<span class="sp" aria-hidden="true"><\/span>/, '$1<span class="sp sp2" aria-hidden="true"></span><span class="br" aria-hidden="true"></span>');
})();
const rnd = (a, b) => a + Math.random() * (b - a);
const T0 = "translate(0,0) rotate(0) rotateX(0) rotateY(0) scale(1)";
const ROUTINES = {
  piano(ls, P) { // keys pressed in a run up or down the keyboard, sometimes as a little melody
    const order = Math.random() < 0.34 ? [...ls].sort(() => Math.random() - 0.5) : Math.random() < 0.5 ? ls : [...ls].reverse(), step = P / 2;
    order.forEach((l, i) => l.animate([{ transform: T0, filter: "brightness(1)" }, { transform: "translate(0,8px) rotate(0) rotateX(-28deg) rotateY(0) scale(1,.84)", filter: "brightness(2.2)", offset: 0.25 }, { transform: T0, filter: "brightness(1)" }], { duration: P * 1.1, delay: i * step, easing: "ease-out" }));
    return (order.length - 1) * step + P * 1.1;
  },
  spin(ls, P) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    ls.forEach((l, i) => l.animate([{ transform: T0 }, { transform: `translate(0,-6px) rotate(0) rotateX(0) rotateY(${dir * 180}deg) scale(1.1)`, offset: 0.5 }, { transform: `translate(0,0) rotate(0) rotateX(0) rotateY(${dir * 360}deg) scale(1)` }], { duration: P * rnd(1.4, 1.8), delay: i * P / 4, easing: "ease-in-out" }));
    return ls.length * P / 4 + P * 1.8;
  },
  flip(ls, P) {
    ls.forEach((l, i) => l.animate([{ transform: T0 }, { transform: "translate(0,-16px) rotate(0) rotateX(180deg) rotateY(0) scale(1)", offset: 0.5 }, { transform: "translate(0,0) rotate(0) rotateX(360deg) rotateY(0) scale(1)" }], { duration: P * 1.5, delay: i * P / 5, easing: "cubic-bezier(.4,0,.3,1)" }));
    return ls.length * P / 5 + P * 1.5;
  },
  fallBack(ls, P) { // tip over backwards like dominoes, then spring back up
    ls.forEach((l, i) => l.animate([{ transform: T0 }, { transform: "translate(0,0) rotate(0) rotateX(-82deg) rotateY(0) scale(1)", offset: 0.3 }, { transform: "translate(0,0) rotate(0) rotateX(-82deg) rotateY(0) scale(1)", offset: 0.55 }, { transform: "translate(0,0) rotate(0) rotateX(14deg) rotateY(0) scale(1)", offset: 0.8 }, { transform: T0 }], { duration: P * 2.6, delay: i * P / 6, easing: "ease-in-out" }));
    return ls.length * P / 6 + P * 2.6;
  },
  fallForward(ls, P) {
    ls.forEach((l, i) => l.animate([{ transform: T0 }, { transform: "translate(0,0) rotate(0) rotateX(80deg) rotateY(0) scale(1)", offset: 0.3 }, { transform: "translate(0,0) rotate(0) rotateX(80deg) rotateY(0) scale(1)", offset: 0.55 }, { transform: "translate(0,0) rotate(0) rotateX(-14deg) rotateY(0) scale(1)", offset: 0.8 }, { transform: T0 }], { duration: P * 2.6, delay: (ls.length - 1 - i) * P / 6, easing: "ease-in-out" }));

  },
  bowling(ls, P, w) { // a ball rolls in and the letters scatter like pins, then the pins reset

    ball.animate([{ transform: "translateX(-40px) rotate(0)", opacity: 0 }, { transform: "translateX(-20px) rotate(180deg)", opacity: 1, offset: 0.1 }, { transform: `translateX(${width + 30}px) rotate(1080deg)`, opacity: 1, offset: 0.9 }, { transform: `translateX(${width + 50}px) rotate(1200deg)`, opacity: 0 }], { duration: roll, easing: "ease-in" }).onfinish = () => ball.remove();

  toast(`Saved “${name}” (${fmtLong(dur)}). Find it in Menu → My recorded mixes.`, 6500);
}
function recSheet() {
  const recs = getRecs();
  openSheet(`<h2>My recorded mixes</h2>
    ${recs.length ? `<div class="fm">${recs.map(r => `<div class="recrow" data-rid="${r.id}"><span class="rn">${esc(r.name)}</span><span class="rm">${fmtLong(r.dur)} · ${(r.size / 1048576).toFixed(1)} MB · .${r.ext}</span>
      <div class="rb"><button type="button" data-rplay>Play</button><button type="button" data-rsave>Save to my device</button><button type="button" class="del" data-rdel>Delete</button></div></div>`).join("")}</div>`
      : `<p>No recordings yet. Tap the red <b>REC</b> button on the control panel to record your mix, and tap it again to stop.</p>`}
    <p style="font-size:13px">Save to my device opens the share sheet on iPhone: choose Save to Files. Recording captures everything the app plays: both decks, blends, effects and drops.</p>
    <div class="foot"><button class="btn primary" type="button" data-close>Done</button></div>`, s => {
    const getBlob = id => audioBlob(id);
    s.querySelectorAll("[data-rplay]").forEach(b => b.onclick = async () => {
      const row = b.closest(".recrow"), blob = await getBlob(row.dataset.rid); if (!blob) return toast("That recording is missing.");
      let a = row.querySelector("audio"); if (!a) { a = document.createElement("audio"); a.controls = true; a.src = URL.createObjectURL(blob); row.appendChild(a); }
      a.play().catch(() => {});
    });
    s.querySelectorAll("[data-rsave]").forEach(b => b.onclick = async () => {
      const r = getRecs().find(x => x.id === b.closest(".recrow").dataset.rid), blob = r && await getBlob(r.id); if (!blob) return toast("That recording is missing.");
      const fname = r.name.replace(/[\\/:*?"<>|]/g, "-") + "." + r.ext;
      try {
        if (downloadsNs) await downloadsNs.save({ filename: fname, data: blob });
        else { // outside Claude: the phone's share sheet (Save to Files), or a plain download
          const file = new File([blob], fname, { type: blob.type || "audio/mp4" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: r.name });
          else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
        }
        toast("Mix saved to your device."); }
      catch (e) { if (e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "A save is already waiting for you. Try again in a moment." : "Saving isn't available here. You can still play the mix in the app."); }
    });
    s.querySelectorAll("[data-rdel]").forEach(b => b.onclick = () => {
      const r = getRecs().find(x => x.id === b.closest(".recrow").dataset.rid); if (!r) return;
      confirmSheet("Delete recording?", `“${r.name}” will be removed from this device.`, "Delete", async () => { await dbDel("audio", r.id); await dbDel("files", r.id); sessionAudio.delete(r.id); setRecs(getRecs().filter(x => x.id !== r.id)); recSheet(); });
    });
  });
}
$("#recBtn").onclick = toggleRec;

/* ---------- start ---------- */
(async function boot() {
  const lastBoot = lsGet("cb.boot"), safe = !!(lastBoot && Date.now() - lastBoot < 5 * 60e3); // the last start never finished
  lsSet("cb.boot", Date.now()); setTimeout(() => lsSet("cb.boot", null), 45000);
  const closedNormally = () => lsSet("cb.boot", null); addEventListener("pagehide", closedNormally); document.addEventListener("visibilitychange", () => { if (document.hidden) closedNormally(); });

  if (had > 0 && st.tracks.size === 0) setTimeout(() => toast(FRAMED ? `Your phone cleared this app's saved songs (${had} were here). This can happen in the Claude app's viewer; for songs that stay put, open the link in Safari and use Share → Add to Home Screen, then add your songs there.` : `Your phone cleared this app's saved songs (${had} were here). Add them again; keeping the app on your Home Screen helps them stay.`, 15000), 800);
  const broken = [];
  if (crashed) { const t = st.tracks.get(crashed); if (t) { t.anFail = 1; dbPut("tracks", t).catch(() => {}); setTimeout(() => toast(`“${t.title}” was too big for this device to analyze, so it was skipped. It still plays.`, 7000), 1200); } }
  if (false) toast("This browser isn't letting Apex Studios DJ App save. Songs you add will be gone when you close the page.", 7000);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if (st.view !== "library" && !curPl()) st.view = "library";
  try { renderAll(); } catch (e) { st.view = "library"; st.q = ""; try { renderAll(); } catch (e2) { $("#content").innerHTML = `<div class="empty"><h2>My DJ Library</h2><p>Something went wrong showing your songs (${esc(e2.message)}). Your songs are safe; reload the page.</p></div>`; } }
  updateDecks(); applyVol();
  restoreQueue();
  if (safe) { setTimeout(() => toast("The app restarted after a problem. Your songs are safe; background clean-up is paused this time.", 7000), 1500); return; }
  setTimeout(() => markOldInstrumentals().catch(() => {}), 2500);
  // songs an earlier build tagged "clean" without really checking them count as unchecked again
  for (const t of st.tracks.values()) if (t.apex && Array.isArray(t.explicit) && !t.explicit.length && !t.cleanChecked && !/\b(clean|radio edit|instrumental)\b/i.test(t.title + " " + (t.fileName || ""))) { delete t.explicit; dbPut("tracks", t).catch(() => {}); }
  // convert songs saved by older versions (Blob) to the reliable format, one at a time, while the app is open
  setTimeout(async () => { let n = 0;
    for (const t of [...st.tracks.values(), ...st.hooks.values()]) { if (await dbHas("audio", t.id)) continue; try { if (await audioBlob(t.id)) n++; } catch (e) {} await new Promise(r => setTimeout(r, 400)); }
    if (n) console.log(`converted ${n} songs to the reliable storage format`); }, 6000);

  setTimeout(async () => { let n = 0; for (const t of st.tracks.values()) { if (!t.bad && await isBroken(t)) { t.bad = 1; dbPut("tracks", t).catch(() => {}); n++; } } if (n) { renderList(); toast(`${n} song${n === 1 ? "'s" : "s'"} audio went missing (marked ⚠). Add the same files again and they're repaired in place, folders and all.`, 9000); } }, 900);
  setTimeout(async () => {
    for (const t of [...st.tracks.values()]) {

      try { ensureCtx(); const r = await reanalyze(t, t.bpm || undefined); Object.assign(t, { loud: r.loud }, t.bpm ? { grid: r.grid, beatOffset: r.beatOffset, autoIn: r.autoIn, autoOut: r.autoOut } : {}); await dbPut("tracks", t); decks.forEach(d => d.track && d.track.id === t.id && applyNorm(d)); } catch (e) {}
